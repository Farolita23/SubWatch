# H2 in MySQL mode keeps the tests free of Docker. Testcontainers + MySQL is planned for a later phase.
spring.datasource.url=jdbc:h2:mem:subwatch-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.mail.host=localhost
subwatch.jwt.secret=test-secret-test-secret-test-secret-0123
subwatch.demo-data.enabled=false
subwatch.rate-limit.enabled=false
subwatch.reminder.run-on-startup=false
