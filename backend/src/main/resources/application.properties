spring.application.name=subwatch
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Time zone used by the daily reminder job and "today" calculations
subwatch.timezone=Europe/Madrid
subwatch.reminder.cron=0 0 8 * * *
subwatch.reminder.days-before=3
subwatch.mail.from=SubWatch <no-reply@subwatch.dev>

subwatch.jwt.secret=${JWT_SECRET:}
subwatch.jwt.access-ttl=15m
subwatch.jwt.refresh-ttl=7d

subwatch.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

subwatch.demo-data.enabled=${SUBWATCH_DEMO_DATA_ENABLED:false}

management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

springdoc.swagger-ui.path=/swagger-ui
