spring.datasource.url=jdbc:h2:mem:subwatch;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

# JWT_SECRET is optional in dev: a random secret is generated at startup when absent.
subwatch.jwt.secret=${JWT_SECRET:}
subwatch.demo-data.enabled=${SUBWATCH_DEMO_DATA_ENABLED:true}

# Dev only: allow the SPA to be opened from other devices on the local network.
subwatch.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.*:*}
