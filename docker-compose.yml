# One command: docker compose up --build   (cp .env.example .env first)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: subwatch
      MYSQL_USER: subwatch
      MYSQL_PASSWORD: ${DB_PASSWORD:-subwatch}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_NAME: subwatch
      DB_USER: subwatch
      DB_PASSWORD: ${DB_PASSWORD:-subwatch}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (min 32 chars)}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # true -> creates demo@subwatch.dev / Demo1234! with 8 subscriptions
      SUBWATCH_DEMO_DATA_ENABLED: ${SEED_DEMO:-true}
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
    restart: unless-stopped

volumes:
  mysql-data:
